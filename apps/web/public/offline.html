<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>You're offline — Change Liberia</title>
<style>
  html, body {
    margin: 0;
    height: 100%;
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
    background: #ffffff;
    color: #18181b;
  }
  @media (prefers-color-scheme: dark) {
    html, body { background: #171717; color: #fafafa; }
  }
  .wrap {
    min-height: 100%;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 24px;
    text-align: center;
  }
  img {
    width: 64px;
    height: 64px;
    margin-bottom: 24px;
  }
  h1 {
    font-size: 1.25rem;
    font-weight: 700;
    margin: 0 0 8px;
  }
  p {
    font-size: 0.95rem;
    color: #52525b;
    margin: 0 0 24px;
    max-width: 320px;
  }
  @media (prefers-color-scheme: dark) {
    p { color: #a3a3a3; }
  }
  button {
    background: #059669;
    color: #ffffff;
    border: none;
    border-radius: 9999px;
    padding: 10px 24px;
    font-size: 0.95rem;
    font-weight: 600;
    cursor: pointer;
  }
  button:hover { background: #047857; }
</style>
</head>
<body>
  <div class="wrap">
    <img src="/icon-192.png" alt="Change Liberia" />
    <h1>You're offline</h1>
    <p>Check your connection and try again. Change Liberia needs an internet connection to load new pages.</p>
    <button onclick="location.reload()">Try again</button>
  </div>
</body>
</html>
